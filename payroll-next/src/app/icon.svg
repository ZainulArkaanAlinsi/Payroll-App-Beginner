<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Lambang Racik untuk tab peramban.

    Bentuknya sama persis dengan lambang di rel navigasi, hanya dibesarkan agar
    tetap terbaca pada 16 piksel: goresannya ditebalkan dan sudut lengkungnya
    dikurangi, karena bentuk yang enak dilihat pada 32 piksel berubah jadi
    gumpalan pada ukuran tab.
  -->
  <defs>
    <linearGradient id="latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e8568" />
      <stop offset="1" stop-color="#1c5443" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#latar)" />
  <path
    d="M11 23V9.6a1.2 1.2 0 0 1 1.92-.96l9.4 7.05a1.2 1.2 0 0 1 0 1.92L17.4 21.2"
    fill="none"
    stroke="#eaf5f0"
